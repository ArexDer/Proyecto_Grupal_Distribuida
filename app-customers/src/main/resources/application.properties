spring.application.name=app-customers
server.port=9191

services.books.url=http://localhost:9090

# Configuración de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/distribuidaG
spring.datasource.username=postgres
spring.datasource.password=admin

# Configuración de Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Consul
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.service-name=app-customers
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s

# Tags para Traefik
spring.cloud.consul.discovery.tags[0]=traefik.enable=true
spring.cloud.consul.discovery.tags[1]=traefik.http.routers.app-customers.rule=PathPrefix(`/app-customers`)
spring.cloud.consul.discovery.tags[2]=traefik.http.routers.app-customers.middlewares=strip-prefix-customers
spring.cloud.consul.discovery.tags[3]=traefik.http.middlewares.strip-prefix-customers.stripPrefix.prefixes=/app-customers

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration   # Directorio donde se encuentran las migraciones SQL
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
