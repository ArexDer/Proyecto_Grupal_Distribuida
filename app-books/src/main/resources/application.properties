spring.application.name=app-books

server.port=9090
# Configuración de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/distribuidaG
spring.datasource.username=postgres
spring.datasource.password=1948

# JPA (opcional si usas Spring Data JPA)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Configuración de Consul
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.instance-id=app-books-${random.int}
spring.cloud.consul.discovery.service-name=app-books
spring.cloud.consul.discovery.health-check-path=/ping
spring.cloud.consul.discovery.health-check-interval=10s


# Etiquetas para Traefik
spring.cloud.consul.discovery.tags[0]=traefik.enable=true
spring.cloud.consul.discovery.tags[1]=traefik.http.routers.app-books.rule=PathPrefix(`/app-books`)
spring.cloud.consul.discovery.tags[2]=traefik.http.routers.app-books.middlewares=strip-prefix-books
spring.cloud.consul.discovery.tags[3]=traefik.http.middlewares.strip-prefix-books.stripPrefix.prefixes=/app-books