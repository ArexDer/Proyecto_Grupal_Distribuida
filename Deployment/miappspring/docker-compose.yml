

services:
  dbserver:
    image: postgres:17.5-alpine3.22
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distribuidaG
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "c:/db-distribuida:/var/lib/postgresql/data"
    ports:
      - "5433:5432"
    networks:
      - app-network



  consul:
    image: consul:1.15.4
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - app-network

  proxy:
    image: traefik:3.4.1
    command:
      --api.insecure=true
      --api.dashboard=true
      --providers.consulCatalog
      --providers.consulCatalog.endpoint.address=consul:8500
      --providers.consulCatalog.refreshInterval=10s
      --providers.consulCatalog.exposedByDefault=false
      --entryPoints.http.address=":80"
      --entryPoints.metrics.address=":8082"
      --metrics.prometheus=true
      --metrics.prometheus.entryPoint=metrics
    ports:
      - "8888:8080"
      - "80:80"
      - "8082:8082"  # Puerto para métricas de Prometheus
    depends_on:
      - consul
    networks:
      - app-network

  authors:
    image: diegorivash/app-authorsspring:latest
    environment:
      # Variables de Spring Boot
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbserver:5432/distribuidaG
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    ports:
      - "7070:8081"
    depends_on:
      - dbserver
      - consul
    networks:
      - app-network

